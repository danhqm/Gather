name: gather-local
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gather
      POSTGRES_USER: gather
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env with a local database password}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gather -d gather"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Database: Host=postgres;Database=gather;Username=gather;Password=${POSTGRES_PASSWORD}
      Database__Initialize: "true"
      Demo__Seed: "true"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
